version: 2
updates:
  # Python backend — uv (pyproject.toml + uv.lock in /backend)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"

  # Frontend — npm (package.json in /frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    # TypeScript is capped at 6.x. 7.0 is the Go port and ships no compiler API at
    # all — its package exports only { version, versionMajorMinor } — so
    # typescript-eslint, pulled in by eslint-config-next, reads versionMajorMinor at
    # module load, throws on major >= 7, and `npm run lint` cannot start. Its peer
    # range is >=4.8.4 <6.1.0. tsc, Vitest and `next build` all pass on 7.0; lint
    # alone is the blocker. Upstream tracks TS >=7.1 in typescript-eslint#10940, so
    # 7.0 will never be supported — drop this once typescript-eslint ships TS 7
    # support. Minor and patch bumps within 6.x keep flowing.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Browser extension — npm (package.json in /extension). The same TypeScript
  # ceiling as the frontend: it lints through typescript-eslint too.
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Docker images at the root — Dockerfile.prod (python, uv, node) and
  # pgvector/pgvector:pg17 in the compose files.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # The dev frontend image (node:24-alpine) — its own Dockerfile, so the root
  # entry above does not see it.
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"

  # Workflow actions — all pinned to major tags; release.yml holds
  # packages: write, so these must not float unwatched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
