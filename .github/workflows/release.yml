name: Release

# Publishes the multi-arch production image to GHCR. Kept separate from ci.yml
# so that workflow can stay on a read-only token.
#
# The tag is the release: pushing one builds that exact commit, publishes the
# image under the matching version tags, and then opens the GitHub Release page
# for it. `push: tags` rather than `release: published` so both routes work off
# one event — publishing from the web UI creates the tag, which lands here too.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runners are amd64, so the arm64 leg is emulated. Only arm64 is
      # registered; installing every binfmt handler is wasted setup time.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # The default `docker` driver cannot build multi-platform images -- it has
      # nowhere to put a manifest list. setup-buildx-action provisions the
      # docker-container driver, which can.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Both the v-prefixed and bare forms of every version are emitted.
          # metadata-action strips the leading v from {{version}}, but setup.sh
          # (--image-tag, and its `^v[0-9]` reuse of the tag as a git ref),
          # docker-compose.published.yml and the docs all name the v form —
          # dropping it breaks the documented pin with `manifest unknown`. The
          # extra tags are refs to the same manifest list, so they cost nothing
          # to build.
          #
          # The branch tag is what gives a workflow_dispatch run (which has no
          # git tag) something to push under.
          #
          # `latest` is deliberately NOT listed: metadata-action's default
          # flavor (latest=auto) already emits it for a semver tag push and
          # correctly skips prereleases. Adding an is_default_branch rule on top
          # would let a workflow_dispatch on main publish an unreleased build as
          # `latest` — which setup.sh installs by default, so it would land
          # straight in every new user's deployment. `latest` must only ever
          # point at a released tag.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every release reinstalls the whole arm64 dependency set
          # under emulation, which is the bulk of the runtime.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs after publish, so the Release page never announces a version whose
  # image failed to build.
  github_release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Open the Release page for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Publishing from the web UI creates the tag, which triggers this same
          # workflow -- so by here the release may already exist, with notes
          # someone wrote by hand. Creating is therefore conditional, never an
          # edit.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
            exit 0
          fi

          # A hyphen is semver's prerelease marker (v0.2.0-rc.1), and matches
          # what metadata-action's latest=auto already excluded from `latest`.
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac

          # Notes start at the previous app release. Left to itself GitHub starts
          # at the latest release of any kind, which can be a browser-extension
          # release (extension-v*) and would drop app changes from these notes.
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[].tagName | select(startswith("v"))] | first // empty')"
          start=""
          if [ -n "$previous" ]; then start="--notes-start-tag $previous"; fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            $start \
            $prerelease

# Retention: do NOT reach for actions/delete-package-versions with
# delete-only-untagged-versions to keep storage down. In a manifest list the
# per-arch child images are themselves untagged package versions -- only the
# index carries the tag -- so a naive "delete untagged" sweep removes the amd64
# and arm64 children out from under a working tag and pulls start failing with
# manifest-unknown. The build's provenance attestations are untagged children
# too, and are why `imagetools inspect` reports extra unknown/unknown entries.
# Use a manifest-list-aware cleaner (dataaxiom/ghcr-cleanup-action) if this ever
# needs automating.
