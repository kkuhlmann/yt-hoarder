name: Extension release

# An extension-vX.Y.Z tag builds the browser extension and attaches the Chrome,
# Firefox and source zips to a GitHub Release. release.yml matches only v*, so
# the app's and the extension's tags never trigger each other. Uploading to the
# Chrome Web Store and AMO stays manual (docs/RELEASING.md).
on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "extension-v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run package

      - run: npm run lint:firefox

      - run: npm run package:source

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A release made from the web UI already exists by now: add the zips to
          # it rather than replacing notes someone wrote by hand.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          # Notes start at the previous extension release. Left to itself GitHub
          # starts at the latest release of any kind, usually an app release.
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[].tagName | select(startswith("extension-v"))] | first // empty')"
          start=""
          if [ -n "$previous" ]; then start="--notes-start-tag $previous"; fi

          # The tag always has a hyphen; a second one is semver's prerelease marker.
          prerelease=""
          case "$TAG" in
            extension-v*-*) prerelease="--prerelease" ;;
          esac

          # --latest=false keeps the repository's "Latest" badge on the app release.
          gh release create "$TAG" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Browser extension ${TAG#extension-}" \
            --verify-tag \
            --generate-notes \
            --latest=false \
            $start $prerelease
