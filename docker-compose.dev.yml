# Development configuration
# Usage: docker compose -f docker-compose.dev.yml up
#
# Features:
# - Separate frontend and backend containers
# - Hot reload via volume mounts
# - Frontend on :3000, Backend on :8000
#
# Shared postgres/backend definitions live in docker-compose.common.yml; only the
# dev-specific deltas are below.
#
# Media storage paths (set in .env; default to ./data/media/* if unset):
#   AUDIO_ONLY_PATH=/path/to/your/audio
#   VIDEO_PATH=/path/to/your/video

services:
  postgres:
    extends:
      file: docker-compose.common.yml
      service: postgres

  backend:
    extends:
      file: docker-compose.common.yml
      service: backend-common
    image: yt-hoarder:backend-dev
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: worker
    healthcheck:
      start_period: 30s
    # extends does not carry depends_on — it has to be declared here.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app
      - ./backend/pyproject.toml:/etc/app/pyproject.toml:ro
      - ./backend/alembic.ini:/alembic/alembic.ini:ro
      - ./backend/migrations:/alembic/migrations:ro
    command: >
      sh -c "
        alembic -c /alembic/alembic.ini upgrade head &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: frontend/.
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # No watch-polling knob is set: inotify works across this bind mount on
      # Linux. If watching is flaky on a non-Linux host (Docker Desktop) or a
      # networked mount, note that Next 16's dev server runs TWO watchers and
      # each has its own switch:
      #   Turbopack, module HMR          -> watchOptions.pollIntervalMs in
      #                                     frontend/next.config.js
      #   watchpack, route discovery,    -> WATCHPACK_POLLING=true here
      #     .env, tsconfig, next.config
      #
      # The two variables below are read by `next dev` at startup rather than
      # baked into an image layer, so changing either needs a restart of this
      # service and never a --build.
      #
      # Empty is the normal value for the API address: the frontend then derives
      # it from whatever address the browser used (see app/lib/api.ts), which is
      # what lets one dev server answer on localhost, a LAN IP and a Tailscale
      # name at once. Set it only when the API is not on :8000 of the host you
      # browse to -- behind a reverse proxy, or with TLS terminated in front.
      - NEXT_PUBLIC_BACKEND_API=${NEXT_PUBLIC_BACKEND_API:-}
      # Next 16 blocks cross-origin dev/HMR requests. next.config.js already
      # allows every dotted host; this is for the ones no wildcard can match --
      # a single-label hostname (http://nas:3000) or an IPv6 literal.
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  hf-cache:
