    { name = "aiofiles" },
    { name = "alembic" },
    { name = "asyncpg" },
    { name = "bcrypt" },
    { name = "cachetools" },
    { name = "fastapi" },
    { name = "faster-whisper" },
    { name = "huggingface-hub" },
    { name = "mcp" },
    { name = "numpy" },
    { name = "onnxruntime" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pydantic-settings" },
    { name = "pyjwt" },
    { name = "python-multipart" },
    { name = "pyyaml" },
    { name = "sqlmodel" },
    { name = "tokenizers" },
    { name = "uvicorn" },
    { name = "yt-dlp", extra = ["curl-cffi", "default"] },
